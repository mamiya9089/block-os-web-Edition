<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>block OS Web Edition 1.3.0</title>
<style>
:root {
  --taskbar-h: 54px;
  --radius: 11px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e14;
  --desktop: #10151f;
  --panel: rgba(24, 27, 34, .97);
  --panel2: #20242d;
  --win: #171a20;
  --win-bar: #22262e;
  --line: rgba(255,255,255,.12);
  --text: #f4f5f7;
  --muted: #a9afba;
  --accent: #4f8cff;
  --btn: #292e38;
  --btn-hover: #353c49;
  --input: #101319;
  --taskbar: rgba(15,17,22,.94);
  --ctx: #20232b;
  --shadow: 0 15px 48px #0009;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f6;
  --desktop: #dfe5ee;
  --panel: rgba(255,255,255,.97);
  --panel2: #f2f4f8;
  --win: #ffffff;
  --win-bar: #e9edf3;
  --line: rgba(0,0,0,.12);
  --text: #1b1f26;
  --muted: #5b6472;
  --accent: #2563eb;
  --btn: #e6eaf1;
  --btn-hover: #d7dde7;
  --input: #ffffff;
  --taskbar: rgba(245,247,251,.94);
  --ctx: #ffffff;
  --shadow: 0 15px 48px rgba(20,30,50,.18);
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
#boot {
  position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column;
  justify-content:center; align-items:center; background:#000;
  transition:opacity .45s ease; touch-action:none;
}
#boot img { display:block; width:min(70vw, 440px); max-height:55vh; object-fit:contain; }
.boot-dots { display:flex; gap:8px; margin-top:38px; height:16px; align-items:center; }
.boot-dots i {
  width:7px; height:7px; border-radius:50%; background:#ddd; opacity:.25;
  animation:bootDot 1.2s infinite ease-in-out;
}
.boot-dots i:nth-child(2){animation-delay:.12s}.boot-dots i:nth-child(3){animation-delay:.24s}
.boot-dots i:nth-child(4){animation-delay:.36s}.boot-dots i:nth-child(5){animation-delay:.48s}
@keyframes bootDot {
  0%,60%,100% { transform:translateY(0) scale(.7); opacity:.28 }
  30% { transform:translateY(-8px) scale(1); opacity:1 }
}
#desktop {
  position:fixed; inset:0 0 var(--taskbar-h); overflow:hidden;
  background-color:var(--desktop);
  background-position:center; background-size:cover; background-repeat:no-repeat;
  touch-action:manipulation;
}
#desktop.fit-contain { background-size:contain; }
#desktop.fit-tile { background-size:auto; background-repeat:repeat; }
#desktop.editing { outline:2px dashed rgba(255,255,255,.42); outline-offset:-5px; }
#desktop-hint {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  padding:7px 12px; border-radius:8px; color:#fff; background:#111c;
  font-size:13px; pointer-events:none; opacity:0; transition:opacity .2s;
}
#desktop.editing #desktop-hint { opacity:1; }
.desktop-icon {
  position:absolute; width:82px; min-height:88px; padding:7px 4px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  border:1px solid transparent; border-radius:8px; text-align:center;
  background:transparent; user-select:none; -webkit-user-select:none; touch-action:none;
}
.desktop-icon:hover, .desktop-icon.selected { background:#ffffff20; border-color:#ffffff36; }
.app-glyph {
  width:43px; height:43px; display:grid; place-items:center; border-radius:12px;
  background:linear-gradient(145deg,#3d4656,#202631); font-size:24px;
  box-shadow:0 4px 12px #0005;
}
:root[data-theme="light"] .app-glyph { background:linear-gradient(145deg,#dfe6f2,#b9c4d6); box-shadow:0 4px 12px #0002; }
.desktop-icon span:last-child { font-size:12px; line-height:1.2; text-shadow:0 1px 3px #000a; overflow-wrap:anywhere; }
:root[data-theme="light"] .desktop-icon span:last-child { color:#10151f; text-shadow:0 1px 2px #fff; }
#taskbar {
  position:fixed; z-index:8000; inset:auto 0 0; height:var(--taskbar-h);
  display:flex; align-items:center; gap:6px; padding:5px 9px;
  background:var(--taskbar); border-top:1px solid var(--line);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#start-button {
  width:42px; height:42px; border:1px solid var(--line); border-radius:9px;
  background:var(--btn); padding:0; display:grid; place-items:center; flex:none;
}
#start-button:hover { background:var(--btn-hover); }
.brick-logo {
  width:26px; height:26px; display:block; border-radius:5px;
  background:
    linear-gradient(#fff,#fff) 0 32%/100% 2px no-repeat,
    linear-gradient(#fff,#fff) 0 66%/100% 2px no-repeat,
    linear-gradient(90deg,transparent 45%,#fff 45%,#fff 51%,transparent 51%) 0 0/100% 33% no-repeat,
    linear-gradient(90deg,transparent 25%,#fff 25%,#fff 31%,transparent 31%,transparent 68%,#fff 68%,#fff 74%,transparent 74%) 0 34%/100% 31% no-repeat,
    linear-gradient(90deg,transparent 62%,#fff 62%,#fff 68%,transparent 68%) 0 68%/100% 30% no-repeat,
    #20242d;
  border:2px solid #fff;
}
:root[data-theme="light"] .brick-logo { filter:invert(1); }
#task-apps { display:flex; align-items:center; gap:4px; min-width:0; flex:1; overflow:auto; scrollbar-width:none; }
.task-app {
  height:40px; min-width:42px; max-width:170px; padding:0 10px; border:0; border-radius:7px;
  background:transparent; display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.task-app:hover, .task-app.active { background:rgba(127,127,127,.18); }
#clock { flex:none; min-width:55px; text-align:center; font-size:12px; line-height:1.25; }
#start-menu {
  position:fixed; z-index:9000; left:8px; bottom:calc(var(--taskbar-h) + 8px);
  width:min(390px, calc(100vw - 16px)); max-height:min(72vh,650px);
  display:none; flex-direction:column; padding:14px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
}
#start-menu.open { display:flex; }
.start-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:11px; }
.start-head strong { font-size:17px; }
#app-search { width:100%; margin-bottom:10px; padding:9px 11px; border-radius:7px; border:1px solid var(--line); background:var(--input); }
#app-list { overflow:auto; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.start-app {
  min-width:0; display:flex; align-items:center; gap:10px; padding:9px;
  border:1px solid transparent; border-radius:8px; background:transparent; text-align:left;
  touch-action:manipulation;
}
.start-app:hover { background:rgba(127,127,127,.12); border-color:var(--line); }
.start-app .app-glyph { width:36px;height:36px;font-size:20px;flex:none; }
.start-app span:last-child { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
#context-menu {
  position:fixed; z-index:9900; display:none; min-width:190px; padding:5px;
  background:var(--ctx); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow);
}
#context-menu.open { display:block; }
#context-menu button { display:block; width:100%; text-align:left; padding:9px 11px; border:0; border-radius:6px; background:transparent; }
#context-menu button:hover { background:rgba(127,127,127,.18); }
.window {
  position:absolute; z-index:10; min-width:280px; min-height:190px; width:min(760px, calc(100vw - 28px));
  height:min(520px, calc(100vh - 95px)); overflow:hidden;
  background:var(--win); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.window.maximized { inset:8px !important; width:auto !important; height:auto !important; }
.window.minimized { display:none; }
.titlebar {
  min-height:42px; display:flex; align-items:center; gap:8px; padding:0 7px 0 13px;
  background:var(--win-bar); border-bottom:1px solid var(--line); cursor:grab; touch-action:none; user-select:none;
}
.titlebar:active { cursor:grabbing; }
.window-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.win-controls { display:flex; gap:3px; }
.win-controls button { width:34px;height:32px;border:0;border-radius:6px;background:transparent; }
.win-controls button:hover { background:rgba(127,127,127,.18); }
.win-controls .close:hover { background:#d84646; color:#fff; }
.window-content { flex:1; min-height:0; overflow:auto; padding:14px; background:var(--win); }
/* resize handles */
.rz { position:absolute; z-index:5; touch-action:none; }
.rz-n  { top:-3px; left:8px; right:8px; height:6px; cursor:ns-resize; }
.rz-s  { bottom:-3px; left:8px; right:8px; height:6px; cursor:ns-resize; }
.rz-e  { right:-3px; top:8px; bottom:8px; width:6px; cursor:ew-resize; }
.rz-w  { left:-3px; top:8px; bottom:8px; width:6px; cursor:ew-resize; }
.rz-ne { top:-4px; right:-4px; width:12px; height:12px; cursor:nesw-resize; }
.rz-nw { top:-4px; left:-4px; width:12px; height:12px; cursor:nwse-resize; }
.rz-se { bottom:-4px; right:-4px; width:14px; height:14px; cursor:nwse-resize; }
.rz-sw { bottom:-4px; left:-4px; width:12px; height:12px; cursor:nesw-resize; }
.window.maximized .rz { display:none; }
.app-toolbar { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.ui-button, .window-content button, .window-content select {
  border:1px solid var(--line); border-radius:7px; background:var(--btn); padding:7px 10px;
}
.ui-button:hover, .window-content button:hover { background:var(--btn-hover); }
input, textarea, select { border:1px solid var(--line); background:var(--input); border-radius:7px; padding:8px 10px; }
textarea { resize:vertical; }
.list { display:flex; flex-direction:column; gap:4px; }
.file-row, .store-row {
  padding:10px 11px; border-radius:7px; background:var(--panel2); cursor:pointer;
  user-select:none; touch-action:manipulation; display:flex; align-items:center; gap:8px;
}
.file-row:hover,.store-row:hover { background:var(--btn-hover); }
.muted { color:var(--muted); font-size:13px; }
.card { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:13px; margin:8px 0; }
#modal-backdrop { position:fixed; inset:0; z-index:9500; display:none; place-items:center; background:#0009; padding:16px; }
#modal-backdrop.open { display:grid; }
.modal { width:min(430px,100%); padding:17px; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.modal h3 { margin:0 0 12px; }
.modal input { width:100%; margin:5px 0 12px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; }
.modal-actions .danger { background:#9e3434; color:#fff; }
.calc { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; max-width:350px; margin:auto; }
.calc-display { grid-column:1/-1; width:100%; text-align:right; font-size:26px; padding:12px; }
.calc button { min-height:48px; font-size:18px; }
.paint-wrap { display:flex; flex-direction:column; gap:8px; height:100%; }
.paint-wrap canvas { width:100%; flex:1; min-height:180px; background:white; border-radius:5px; touch-action:none; }
.puzzle { display:grid; grid-template-columns:repeat(5,minmax(38px,60px)); gap:6px; }
.puzzle button { aspect-ratio:1; font-size:22px; }
.terminal-output { white-space:pre-wrap; font:13px/1.5 ui-monospace,monospace; }
.terminal-line { display:flex; gap:7px; }
.terminal-line input { flex:1; min-width:0; font-family:monospace; }
/* b-Search */
.bs-toolbar { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.bs-toolbar input { flex:1; min-width:140px; }
.bs-view { position:relative; flex:1; min-height:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel2); display:flex; flex-direction:column; }
.bs-home { padding:30px 20px; text-align:center; }
.bs-home h2 { margin:0 0 8px; font-size:28px; letter-spacing:.5px; }
.bs-home .bs-big { font-size:20px; }
.bs-results { padding:14px 16px; overflow:auto; flex:1; }
.bs-result { margin-bottom:18px; }
.bs-result a { color:#5aa2ff; font-size:18px; text-decoration:none; cursor:pointer; display:block; }
.bs-result a:hover { text-decoration:underline; }
.bs-result .url { color:#57c08a; font-size:12px; margin:2px 0; overflow-wrap:anywhere; }
.bs-result .snip { font-size:13px; color:var(--muted); line-height:1.5; }
.bs-info { padding:10px 14px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
.bs-frame { width:100%; flex:1; border:0; background:#fff; }
.bs-blocked { padding:26px; text-align:center; }
.bs-blocked .big { font-size:18px; margin-bottom:8px; }
.bs-frame-wrap { flex:1; min-height:0; display:flex; }
.bs-engine-links { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.bs-engine-links button { font-size:12px; padding:5px 8px; }
@media(max-width:600px) {
  :root { --taskbar-h:52px; }
  .window { min-width:calc(100vw - 18px); width:calc(100vw - 18px); height:min(72vh,600px); left:9px !important; top:9px !important; }
  .window.maximized { inset:4px !important; }
  #app-list { grid-template-columns:1fr; }
  #clock { font-size:11px; }
  .bs-result a { font-size:16px; }
}
</style>
</head>
<body>
<div id="boot" aria-label="block OS 起動中">
  <img src="assets/block-os-logo.png" alt="block OS ロゴ">
  <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<main id="desktop" aria-label="デスクトップ">
  <div id="desktop-hint">アイコンをドラッグして配置できます。空白をタップすると編集を終了します。</div>
</main>

<div id="taskbar">
  <button id="start-button" aria-label="スタートメニュー"><span class="brick-logo"></span></button>
  <div id="task-apps"></div>
  <div id="clock"></div>
</div>

<section id="start-menu" aria-label="スタートメニュー">
  <div class="start-head"><strong>block OS</strong><span class="muted">1.3.0</span></div>
  <input id="app-search" type="search" placeholder="アプリを検索">
  <div id="app-list"></div>
</section>
<div id="context-menu"></div>
<div id="modal-backdrop"><div class="modal" id="modal"></div></div>

<script>
(() => {
  "use strict";

  const VERSION = "1.3.0";
  const STORAGE_KEY = "blockos-web-1.3.0";
  const OLD_KEY = "blockos-web-1.2.3";

  const APPS = [
    {id:"store", name:"App Store", icon:"🛍️", core:true},
    {id:"search", name:"b-Search", icon:"🔎", core:true},
    {id:"puzzle", name:"ブロックパズル", icon:"🧩", core:true},
    {id:"paint", name:"Paint", icon:"🎨", core:true},
    {id:"timer", name:"Timer", icon:"⏱️", core:true},
    {id:"files", name:"Files", icon:"📁", core:true},
    {id:"notes", name:"Notes", icon:"📝", core:true},
    {id:"calculator", name:"Calculator", icon:"🧮", core:true},
    {id:"settings", name:"Settings", icon:"⚙️", core:true},
    {id:"terminal", name:"Terminal", icon:"⌨️", core:true},
    {id:"about", name:"About", icon:"ℹ️", core:true}
  ];
  const APP_BY_ID = Object.fromEntries(APPS.map(a => [a.id, a]));

  const WALL_LIGHT = "assets/wallpaper-light.jpg";
  const WALL_DARK  = "assets/wallpaper-dark.jpg";
  const LOGO       = "assets/block-os-logo.png";

  const defaults = {
    theme: "dark",
    wallpaper: { dark: WALL_DARK, light: WALL_LIGHT },
    fit: "cover",
    installed: APPS.map(a => a.id),
    home: [],
    positions: {},
    files: [
      {name:"ようこそ.txt", content:"block OS Web Edition 1.3.0 へようこそ！\nFilesで編集・保存できます。"},
      {name:"メモ.txt", content:""}
    ],
    notes: "",
    puzzleScore: 0
  };

  function loadState() {
    let saved = {};
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_KEY);
      if (raw) saved = JSON.parse(raw) || {};
    } catch (e) { console.warn("保存データを読み込めません。", e); }
    const result = {...defaults, ...saved};
    if (!["dark","light"].includes(result.theme)) result.theme = "dark";
    if (!result.wallpaper || typeof result.wallpaper !== "object") result.wallpaper = {dark:WALL_DARK, light:WALL_LIGHT};
    result.wallpaper.dark = result.wallpaper.dark || WALL_DARK;
    result.wallpaper.light = result.wallpaper.light || WALL_LIGHT;
    if (!["cover","contain","tile"].includes(result.fit)) result.fit = "cover";
    result.home = Array.isArray(saved.home) ? saved.home.filter(id => APP_BY_ID[id]) : [];
    result.positions = saved.positions && typeof saved.positions === "object" ? saved.positions : {};
    // 標準アプリは常にインストール済み
    const coreIds = APPS.filter(a=>a.core).map(a=>a.id);
    result.installed = Array.from(new Set([...(Array.isArray(saved.installed)?saved.installed:[]), ...coreIds])).filter(id=>APP_BY_ID[id]);
    result.files = Array.isArray(saved.files) ? saved.files.filter(f => f && typeof f.name === "string").map(f => ({name:f.name, content:String(f.content ?? "")})) : defaults.files.map(f=>({...f}));
    result.notes = typeof saved.notes === "string" ? saved.notes : "";
    result.puzzleScore = Number(saved.puzzleScore) || 0;
    return result;
  }
  let state = loadState();
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { alert("保存領域が不足しているか、利用できません。"); }
  }

  const desktop = document.getElementById("desktop");
  const startMenu = document.getElementById("start-menu");
  const appList = document.getElementById("app-list");
  const contextMenu = document.getElementById("context-menu");
  const taskApps = document.getElementById("task-apps");
  const windows = new Map();
  let zTop = 20, longTimer = null, suppressClickUntil = 0;
  let desktopHold = null;
  let modalCallback = null;

  function appIcon(id) { return APP_BY_ID[id]?.icon || "▣"; }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function showModal(title, body, actions, callback) {
    const modal = document.getElementById("modal");
    modalCallback = callback || null;
    modal.innerHTML = `<h3>${escapeHtml(title)}</h3>${body}<div class="modal-actions">${actions || '<button data-modal="cancel">閉じる</button>'}</div>`;
    document.getElementById("modal-backdrop").classList.add("open");
    modal.querySelectorAll("[data-modal]").forEach(b => b.addEventListener("click", () => {
      const action = b.dataset.modal;
      document.getElementById("modal-backdrop").classList.remove("open");
      const cb = modalCallback; modalCallback = null;
      if (cb) cb(action);
    }));
    modal.querySelector("input")?.focus();
  }
  function closeModal() { document.getElementById("modal-backdrop").classList.remove("open"); modalCallback=null; }

  /* ---------- Theme & Wallpaper ---------- */
  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = state.theme === "dark" ? "#111318" : "#eef1f6";
    applyWallpaper();
  }
  function applyWallpaper() {
    const url = state.wallpaper[state.theme] || (state.theme==="dark"?WALL_DARK:WALL_LIGHT);
    desktop.classList.remove("fit-contain","fit-tile");
    if (state.fit === "contain") desktop.classList.add("fit-contain");
    if (state.fit === "tile") desktop.classList.add("fit-tile");
    desktop.style.backgroundImage = `linear-gradient(135deg,rgba(0,0,0,${state.theme==="dark"?.22:.05}),rgba(0,0,0,${state.theme==="dark"?.5:.12})),url("${url}")`;
  }

  /* ---------- Start menu ---------- */
  function renderStartList(filter="") {
    const q = filter.trim().toLowerCase();
    const items = APPS.filter(a => state.installed.includes(a.id) && (!q || a.name.toLowerCase().includes(q)));
    appList.innerHTML = "";
    items.forEach(app => {
      const b = document.createElement("button");
      b.className = "start-app"; b.innerHTML = `<span class="app-glyph">${app.icon}</span><span>${escapeHtml(app.name)}</span>`;
      b.dataset.app = app.id;
      b.addEventListener("click", () => { closeStart(); openApp(app.id); });
      b.addEventListener("pointerdown", e => {
        if (e.button !== undefined && e.button !== 0) return;
        clearTimeout(longTimer);
        longTimer = setTimeout(() => {
          suppressClickUntil = Date.now() + 500;
          showAppMenu(app.id, e.clientX, e.clientY, "start");
        }, 600);
      });
      ["pointerup","pointercancel","pointerleave"].forEach(type => b.addEventListener(type, () => clearTimeout(longTimer)));
      b.addEventListener("contextmenu", e => { e.preventDefault(); showAppMenu(app.id,e.clientX,e.clientY,"start"); });
      appList.appendChild(b);
    });
  }
  function closeStart() { startMenu.classList.remove("open"); }
  document.getElementById("start-button").addEventListener("click", e => {
    e.stopPropagation(); startMenu.classList.toggle("open"); renderStartList(document.getElementById("app-search").value);
  });
  document.getElementById("app-search").addEventListener("input", e => renderStartList(e.target.value));
  document.addEventListener("pointerdown", e => {
    if (!startMenu.contains(e.target) && e.target.id !== "start-button" && !e.target.closest("#start-button")) closeStart();
    if (!contextMenu.contains(e.target)) contextMenu.classList.remove("open");
  });

  /* ---------- Desktop icons ---------- */
  function renderDesktopIcons() {
    desktop.querySelectorAll(".desktop-icon").forEach(n=>n.remove());
    state.home.forEach((id, index) => {
      const app = APP_BY_ID[id]; if (!app) return;
      const icon = document.createElement("button");
      icon.className = "desktop-icon"; icon.dataset.app = id;
      const pos = state.positions[id] || {x:12 + (Math.floor(index/6)*94), y:14 + ((index%6)*98)};
      icon.style.left = `${Math.max(0, Number(pos.x)||0)}px`;
      icon.style.top = `${Math.max(0, Number(pos.y)||0)}px`;
      icon.innerHTML = `<span class="app-glyph">${app.icon}</span><span>${escapeHtml(app.name)}</span>`;
      icon.addEventListener("click", e => {
        if (Date.now() < suppressClickUntil) { e.preventDefault(); return; }
        if (!desktop.classList.contains("editing")) openApp(id);
      });
      icon.addEventListener("contextmenu", e => { e.preventDefault(); showAppMenu(id,e.clientX,e.clientY,"desktop"); });
      setupIconDrag(icon, id);
      desktop.appendChild(icon);
    });
  }
  function setupIconDrag(icon, id) {
    let startX=0,startY=0,origX=0,origY=0,moved=false;
    icon.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      startX=e.clientX; startY=e.clientY;
      origX=parseFloat(icon.style.left)||0; origY=parseFloat(icon.style.top)||0; moved=false;
      icon.setPointerCapture?.(e.pointerId);
    });
    icon.addEventListener("pointermove", e => {
      if (!icon.hasPointerCapture?.(e.pointerId)) return;
      if (Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>7) {
        moved=true; desktop.classList.add("editing"); icon.classList.add("selected");
        const rect=desktop.getBoundingClientRect();
        icon.style.left=`${Math.max(0,Math.min(rect.width-82,origX+e.clientX-startX))}px`;
        icon.style.top=`${Math.max(0,Math.min(rect.height-88,origY+e.clientY-startY))}px`;
      }
    });
    icon.addEventListener("pointerup", e => {
      if (moved) {
        const x=Math.round((parseFloat(icon.style.left)||0)/94)*94;
        const y=Math.round((parseFloat(icon.style.top)||0)/98)*98;
        icon.style.left=`${x}px`; icon.style.top=`${y}px`;
        state.positions[id]={x,y}; saveState(); suppressClickUntil=Date.now()+350;
      }
      try { icon.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  }
  function showAppMenu(id, x, y, source) {
    const isHome = state.home.includes(id);
    contextMenu.innerHTML = `
      <button data-action="open">開く</button>
      <button data-action="${isHome ? "remove" : "add"}">${isHome ? "ホーム画面から削除" : "ホーム画面に追加"}</button>`;
    contextMenu.style.left=`${Math.min(x, innerWidth-205)}px`;
    contextMenu.style.top=`${Math.min(y, innerHeight-105)}px`;
    contextMenu.classList.add("open");
    contextMenu.querySelector('[data-action="open"]').onclick=()=>{contextMenu.classList.remove("open");openApp(id);};
    contextMenu.querySelector('[data-action="add"],[data-action="remove"]').onclick=()=>{
      if (isHome) state.home=state.home.filter(item=>item!==id);
      else if (!state.home.includes(id)) state.home.push(id);
      saveState(); renderDesktopIcons(); renderStartList(document.getElementById("app-search").value);
      contextMenu.classList.remove("open");
    };
  }

  let holdStart = null;
  desktop.addEventListener("pointerdown", e => {
    if (e.target !== desktop && e.target.id !== "desktop-hint") return;
    holdStart={x:e.clientX,y:e.clientY};
    clearTimeout(desktopHold);
    desktopHold=setTimeout(()=>{ desktop.classList.add("editing"); },550);
  });
  desktop.addEventListener("pointermove", e => {
    if (holdStart && Math.abs(e.clientX-holdStart.x)+Math.abs(e.clientY-holdStart.y)>12) clearTimeout(desktopHold);
  });
  ["pointerup","pointercancel"].forEach(type=>desktop.addEventListener(type,()=>{
    clearTimeout(desktopHold); holdStart=null;
  }));
  desktop.addEventListener("click", e => {
    if (e.target===desktop || e.target.id==="desktop-hint") {
      desktop.classList.remove("editing");
      desktop.querySelectorAll(".selected").forEach(n=>n.classList.remove("selected"));
    }
  });
