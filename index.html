<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>block os 1.1.0</title>
<style>
:root{--accent:#76e4c3;--wall:#111827;--panel:rgba(18,27,43,.88);--line:rgba(255,255,255,.13);--text:#f4f7fb;--muted:#aab6c8}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:var(--text);overflow:hidden;background:var(--wall)}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
#desktop{position:fixed;inset:0 0 58px;background:radial-gradient(ellipse at 18% 15%,#245b64 0,transparent 38%),radial-gradient(ellipse at 85% 75%,#3b356d 0,transparent 42%),linear-gradient(135deg,#101827,#18263c 55%,#111827);overflow:hidden}
#desktop:before{content:"";position:absolute;inset:0;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
.brand{position:absolute;left:28px;top:25px;font-size:clamp(22px,4vw,38px);font-weight:800;letter-spacing:-1.8px}.brand small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:600;margin-top:3px}
.desktop-icons{position:absolute;left:20px;top:110px;display:grid;gap:12px;grid-template-columns:repeat(1,76px)}
.dicon{border:0;background:transparent;border-radius:12px;padding:9px 3px;display:grid;justify-items:center;gap:6px;font-size:12px;text-shadow:0 2px 8px #000}.dicon:hover,.dicon:focus{background:#ffffff1c;outline:1px solid #ffffff25}.glyph{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#ffffff35,#ffffff0c);border:1px solid #ffffff30;box-shadow:0 8px 22px #0003}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:58px;background:rgba(10,16,28,.82);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 13px;gap:9px;z-index:1000}
#start{border:1px solid #ffffff25;background:#ffffff12;border-radius:13px;width:42px;height:42px;font-size:20px;color:var(--accent)}#taskapps{display:flex;gap:6px;flex:1;overflow:auto}#taskapps button{border:1px solid transparent;background:#ffffff0d;border-radius:10px;padding:8px 11px;white-space:nowrap;font-size:12px}#taskapps button.active{border-color:var(--accent);background:#76e4c31a}
#clock{font-size:12px;color:#e6edf7;text-align:right;min-width:68px}
#startmenu{position:fixed;z-index:1200;bottom:68px;left:12px;width:min(340px,calc(100vw - 24px));background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 20px 70px #0008;display:none}
#startmenu.show{display:block}.menuhead{font-weight:800;font-size:19px;margin-bottom:12px}.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.appbtn{border:1px solid var(--line);background:#ffffff0b;border-radius:12px;padding:12px 5px;display:grid;justify-items:center;gap:7px;font-size:12px}.appbtn span:first-child{font-size:23px}
.window{position:absolute;z-index:10;width:min(620px,calc(100vw - 28px));height:min(440px,calc(100% - 30px));min-width:270px;min-height:190px;background:rgba(20,29,45,.96);backdrop-filter:blur(20px);border:1px solid #ffffff28;border-radius:15px;box-shadow:0 22px 70px #0008;overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:43px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:#ffffff08;cursor:move;touch-action:none;gap:9px}.wtitle{font-weight:700;font-size:13px;flex:1}.wcontrols{display:flex;gap:6px}.wcontrols button{width:25px;height:25px;border:0;border-radius:8px;background:#ffffff14}.wcontrols .close{background:#d65e68}.content{padding:15px;overflow:auto;flex:1;font-size:14px}.window.max{inset:8px!important;width:auto!important;height:auto!important}
h2{font-size:18px;margin:0 0 12px}p{line-height:1.6;color:#c6d1df}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#ffffff12;padding:9px 12px;border-radius:10px}.btn.primary{background:var(--accent);color:#10211e;border-color:transparent;font-weight:700}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.tile{padding:13px;border:1px solid var(--line);background:#ffffff09;border-radius:12px;margin:8px 0}.file{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px}.file:hover{background:#ffffff12}.file button{margin-left:auto}
textarea.field{min-height:190px;resize:vertical}.calc{max-width:340px}.calcdisplay{font-size:28px;text-align:right;padding:15px;background:#0b1220;border-radius:10px;margin-bottom:9px;min-height:60px;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.keys button{padding:14px 5px;border:1px solid var(--line);border-radius:10px;background:#ffffff12;font-size:17px}.keys button.op{color:var(--accent)}
.term{background:#080d16;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;min-height:220px;white-space:pre-wrap;color:#b8f4d9}.term input{background:transparent;border:0;color:#fff;outline:0;font-family:inherit;width:70%}
#toast{position:fixed;z-index:2000;bottom:75px;left:50%;transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);padding:10px 15px;border-radius:12px;display:none;font-size:13px}
@media(max-width:600px){#desktop{bottom:58px}.brand{left:17px;top:17px}.desktop-icons{left:10px;top:95px;grid-template-columns:repeat(2,72px)}.window{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100% - 16px)!important;min-width:0}.window.max{inset:4px!important}.content{padding:12px}#taskbar{padding:0 8px;gap:6px}#taskapps button{padding:8px}}
</style>
</head>
<body>
<main id="desktop">
 <div class="brand">block os <small>VERSION 1.1.0 · WEB EDITION</small></div>
 <div class="desktop-icons" id="desktopIcons"></div>
</main>
<div id="taskbar"><button id="start" title="スタート">▦</button><div id="taskapps"></div><div id="clock"></div></div>
<div id="startmenu"><div class="menuhead">block os</div><div class="appgrid" id="appgrid"></div><p class="muted" style="font-size:11px;margin:14px 2px 0">Web Edition · ブラウザ内で動作</p></div>
<div id="toast"></div>
<script>
(()=>{
const apps=[
 {id:'files',name:'ファイル',icon:'📁',open:filesApp},
 {id:'notes',name:'メモ帳',icon:'📝',open:notesApp},
 {id:'calc',name:'電卓',icon:'🧮',open:calcApp},
 {id:'browser',name:'ブラウザ',icon:'🌐',open:browserApp},
 {id:'settings',name:'設定',icon:'⚙️',open:settingsApp},
 {id:'terminal',name:'ターミナル',icon:'⌘',open:terminalApp},
 {id:'about',name:'このOSについて',icon:'◈',open:aboutApp}
];
let z=20,winCount=0,notes=localStorage.blockNotes||'',accent=localStorage.blockAccent||'#76e4c3';
document.documentElement.style.setProperty('--accent',accent);
const desktopIcons=document.getElementById('desktopIcons'),appgrid=document.getElementById('appgrid'),taskapps=document.getElementById('taskapps'),menu=document.getElementById('startmenu');
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function launch(id){let a=apps.find(x=>x.id===id);if(a)a.open()}
apps.forEach(a=>{let b=document.createElement('button');b.className='dicon';b.innerHTML=`<span class="glyph">${a.icon}</span><span>${a.name}</span>`;b.onclick=()=>launch(a.id);desktopIcons.append(b);let m=document.createElement('button');m.className='appbtn';m.innerHTML=`<span>${a.icon}</span><span>${a.name}</span>`;m.onclick=()=>{launch(a.id);menu.classList.remove('show')};appgrid.append(m)});
document.getElementById('start').onclick=()=>menu.classList.toggle('show');
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target.id!=='start')menu.classList.remove('show')});
function win(id,title,icon,body,w=560,h=390){let old=document.querySelector(`[data-app="${id}"]`);if(old){focus(old);return old}
let el=document.createElement('section');el.className='window';el.dataset.app=id;el.style.width=`min(${w}px,calc(100vw - 28px))`;el.style.height=`min(${h}px,calc(100% - 30px))`;el.style.left=Math.max(10,Math.min(innerWidth-w-20,80+winCount*24))+'px';el.style.top=Math.max(10,Math.min(innerHeight-h-90,55+winCount*20))+'px';winCount++;
el.innerHTML=`<div class="titlebar"><span>${icon}</span><span class="wtitle">${title}</span><div class="wcontrols"><button class="min">−</button><button class="max">□</button><button class="close">×</button></div></div><div class="content">${body}</div>`;
document.getElementById('desktop').append(el);let task=document.createElement('button');task.textContent=icon+' '+title;task.onclick=()=>{if(el.style.display==='none'){el.style.display='flex';focus(el)}else if(el.classList.contains('focused')){el.style.display='none';task.classList.remove('active')}else focus(el)};taskapps.append(task);el._task=task;
el.querySelector('.close').onclick=()=>{el.remove();task.remove()};el.querySelector('.min').onclick=()=>{el.style.display='none';task.classList.remove('active')};el.querySelector('.max').onclick=()=>{el.classList.toggle('max');if(!el.classList.contains('max')){el.style.left='50px';el.style.top='35px'}};let bar=el.querySelector('.titlebar');bar.addEventListener('pointerdown',e=>{if(innerWidth<600||el.classList.contains('max')||e.target.closest('button'))return;focus(el);let r=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;bar.setPointerCapture(e.pointerId);function move(ev){el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,r.left+ev.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-100,r.top+ev.clientY-sy))+'px'}function end(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',end)}bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',end)});el.addEventListener('pointerdown',()=>focus(el));focus(el);return el}
function focus(el){document.querySelectorAll('.window').forEach(x=>{x.classList.remove('focused');x._task?.classList.remove('active')});el.classList.add('focused');el.style.zIndex=++z;el._task?.classList.add('active')}
function filesApp(){let files=JSON.parse(localStorage.blockFiles||'["はじめに.txt","アイデア.txt"]');let w=win('files','ファイルマネージャー','📁',`<h2>このデバイス</h2><div class="muted">ホーム / ユーザーファイル</div><div id="filelist"></div><div class="row"><button class="btn primary" id="newfile">＋ 新規テキスト</button><button class="btn" id="refresh">更新</button></div><p class="muted">ファイル一覧はこのブラウザに保存されます。</p>`,520,370);let list=w.querySelector('#filelist');function draw(){list.innerHTML='';files.forEach((f,i)=>{let d=document.createElement('div');d.className='file';d.innerHTML=`<span>📄</span><span>${escapeHTML(f)}</span><button class="btn">開く</button>`;d.querySelector('button').onclick=()=>{if(f==='はじめに.txt')showText('block os 1.1.0へようこそ。これはブラウザ上で動く小さなOSです。');else showText(localStorage['blockFile_'+f]||'')};list.append(d)})}function showText(t){let p=win('viewer','テキストビューアー','📄',`<pre style="white-space:pre-wrap">${escapeHTML(t)}</pre>`,440,300)}w.querySelector('#newfile').onclick=()=>{let f='新しいファイル '+(files.length+1)+'.txt';files.push(f);localStorage.blockFiles=JSON.stringify(files);localStorage['blockFile_'+f]='';draw();toast('ファイルを作成しました')};w.querySelector('#refresh').onclick=draw;draw()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notesApp(){let w=win('notes','メモ帳','📝',`<div class="row" style="justify-content:space-between;margin-bottom:9px"><span class="muted">自動保存 · ローカル</span><button class="btn" id="clear">クリア</button></div><textarea class="field" id="notearea" placeholder="ここにメモを入力..."></textarea>`,560,390);let ta=w.querySelector('textarea');ta.value=notes;ta.addEventListener('input',()=>{notes=ta.value;localStorage.blockNotes=notes});w.querySelector('#clear').onclick=()=>{if(confirm('メモを消去しますか？')){ta.value='';notes='';localStorage.blockNotes=''}}}
function calcApp(){let w=win('calc','電卓','🧮',`<div class="calc"><div class="calcdisplay" id="display">0</div><div class="keys">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','＋','C','(',')','='].map(x=>`<button class="${'÷×−＋'.includes(x)?'op':''}" data-k="${x}">${x}</button>`).join('')}</div></div>`,360,430);let d=w.querySelector('#display'),s='';w.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='C')s='';else if(k==='⌫')s=s.slice(0,-1);else if(k==='='){try{let ex=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/＋/g,'+');if(!/^[0-9+\-*/().\s]+$/.test(ex))throw 0;s=String(Function('"use strict";return ('+ex+')')());if(!Number.isFinite(Number(s)))throw 0}catch{s='エラー'}}else s+=k;d.textContent=s||'0'})}
function browserApp(){let w=win('browser','ミニブラウザ','🌐',`<form class="row" id="nav"><input class="field" style="flex:1;min-width:100px" id="url" value="https://example.com" placeholder="https://..."><button class="btn primary">開く</button></form><div style="height:calc(100% - 52px);margin-top:12px"><iframe id="frame" title="Webページ" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer" style="width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:white"></iframe></div><p class="muted" style="font-size:11px">サイト側の制限により表示できないページもあります。</p>`,700,480);let f=w.querySelector('iframe'),inp=w.querySelector('#url');function go(){let u=inp.value.trim();if(!/^https?:\\/\\//i.test(u))u='https://'+u;try{new URL(u);f.src=u}catch{toast('URLを確認してください')}}w.querySelector('#nav').onsubmit=e=>{e.preventDefault();go()};go()}
function settingsApp(){let w=win('settings','設定','⚙️',`<h2>パーソナル設定</h2><div class="tile"><b>アクセントカラー</b><p class="muted">OSの強調色を変更します。</p><input type="color" id="color" value="${accent}" style="width:70px;height:38px;background:transparent;border:0"><button class="btn" id="apply">適用</button></div><div class="tile"><b>ストレージ</b><p class="muted">メモや設定はこのブラウザのローカルストレージに保存されます。</p><button class="btn" id="clear">保存データを初期化</button></div><div class="tile"><b>表示</b><p class="muted">PC・スマートフォン両対応。スマホではウィンドウが画面サイズに合わせて表示されます。</p></div>`,500,410);w.querySelector('#apply').onclick=()=>{accent=w.querySelector('#color').value;document.documentElement.style.setProperty('--accent',accent);localStorage.blockAccent=accent;toast('テーマカラーを変更しました')};w.querySelector('#clear').onclick=()=>{if(confirm('メモ・ファイル一覧・テーマ設定を初期化しますか？')){localStorage.removeItem('blockNotes');localStorage.removeItem('blockFiles');localStorage.removeItem('blockAccent');toast('保存データを初期化しました。再読み込みしてください')}}}
function terminalApp(){let w=win('terminal','ターミナル','⌘',`<div class="term" id="term">block os terminal [version 1.1.0]\nコマンド一覧: help, date, about, clear, echo\n<br><span id="out"></span><div>&gt; <input id="cmd" autocomplete="off" spellcheck="false"></div></div>`,560,340);let inp=w.querySelector('#cmd'),out=w.querySelector('#out');inp.focus();inp.onkeydown=e=>{if(e.key!=='Enter')return;let v=inp.value.trim(),p=v.split(' ');inp.value='';let r='';if(p[0]==='help')r='help  date  about  clear  echo [text]';else if(p[0]==='date')r=new Date().toString();else if(p[0]==='about')r='block os 1.1.0 / Web Edition';else if(p[0]==='echo')r=p.slice(1).join(' ');else if(p[0]==='clear'){out.textContent='';return}else if(v)r='command not found: '+p[0];out.textContent+=(out.textContent?'\n':'')+'> '+v+'\n'+r+'\n';w.querySelector('.term').scrollTop=9999}}
function aboutApp(){win('about','block osについて','◈',`<div style="text-align:center;padding:15px"><div style="font-size:48px;color:var(--accent)">◈</div><h2 style="font-size:25px">block os 1.1.0</h2><p>小さくて自由な、ブラウザで動くOS。</p><div class="tile">WEB EDITION<br><span class="muted">HTML · CSS · JavaScript</span></div><p class="muted">これは実際のPCのOSを置き換えるものではなく、ブラウザ内で動くデスクトップ環境です。</p></div>`,430,340)}
function updateClock(){let d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}
updateClock();setInterval(updateClock,1000);
})();
</script>
</body>
</html>
