<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>block OS Web Edition 1.2.3</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111318;
  --panel: rgba(25, 28, 35, .97);
  --panel2: #20242d;
  --line: rgba(255,255,255,.12);
  --text: #f4f5f7;
  --muted: #a9afba;
  --accent: #4f8cff;
  --taskbar-h: 54px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#08090b; color:var(--text); }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
#boot {
  position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column;
  justify-content:center; align-items:center; background:#000;
  transition:opacity .45s ease;
}
#boot img { display:block; width:min(70vw, 440px); max-height:55vh; object-fit:contain; }
.boot-dots { display:flex; gap:8px; margin-top:38px; height:16px; align-items:center; }
.boot-dots i {
  width:7px; height:7px; border-radius:50%; background:#ddd; opacity:.25;
  animation:bootDot 1.2s infinite ease-in-out;
}
.boot-dots i:nth-child(2){animation-delay:.12s}.boot-dots i:nth-child(3){animation-delay:.24s}
.boot-dots i:nth-child(4){animation-delay:.36s}.boot-dots i:nth-child(5){animation-delay:.48s}
@keyframes bootDot {
  0%,60%,100% { transform:translateY(0) scale(.7); opacity:.28 }
  30% { transform:translateY(-8px) scale(1); opacity:1 }
}
#desktop {
  position:fixed; inset:0 0 var(--taskbar-h); overflow:hidden;
  background-color:#18212d;
  background-image:linear-gradient(135deg,rgba(0,0,0,.22),rgba(0,0,0,.5));
  background-position:center; background-size:cover;
  touch-action:manipulation;
}
#desktop.editing { outline:2px dashed rgba(255,255,255,.42); outline-offset:-5px; }
#desktop-hint {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  padding:7px 12px; border-radius:8px; color:#fff; background:#111c;
  font-size:13px; pointer-events:none; opacity:0; transition:opacity .2s;
}
#desktop.editing #desktop-hint { opacity:1; }
.desktop-icon {
  position:absolute; width:82px; min-height:88px; padding:7px 4px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  border:1px solid transparent; border-radius:8px; text-align:center;
  background:transparent; user-select:none; -webkit-user-select:none; touch-action:none;
}
.desktop-icon:hover, .desktop-icon.selected { background:#ffffff20; border-color:#ffffff36; }
.app-glyph {
  width:43px; height:43px; display:grid; place-items:center; border-radius:12px;
  background:linear-gradient(145deg,#3d4656,#202631); font-size:24px;
  box-shadow:0 4px 12px #0005;
}
.desktop-icon span:last-child { font-size:12px; line-height:1.2; text-shadow:0 1px 3px #000; overflow-wrap:anywhere; }
#taskbar {
  position:fixed; z-index:8000; inset:auto 0 0; height:var(--taskbar-h);
  display:flex; align-items:center; gap:6px; padding:5px 9px;
  background:rgba(15,17,22,.94); border-top:1px solid #ffffff17;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#start-button {
  width:42px; height:42px; border:1px solid #ffffff35; border-radius:9px;
  background:#26303d; padding:6px; display:grid; place-items:center; flex:none;
}
.brick-logo {
  width:28px; height:28px; position:relative; border:2px solid #eee; border-radius:5px;
  background:
    linear-gradient(#eee,#eee) 0 32%/100% 2px no-repeat,
    linear-gradient(#eee,#eee) 0 66%/100% 2px no-repeat,
    linear-gradient(90deg,transparent 45%,#eee 45%,#eee 51%,transparent 51%) 0 0/100% 33% no-repeat,
    linear-gradient(90deg,transparent 25%,#eee 25%,#eee 31%,transparent 31%,transparent 68%,#eee 68%,#eee 74%,transparent 74%) 0 34%/100% 31% no-repeat,
    linear-gradient(90deg,transparent 62%,#eee 62%,#eee 68%,transparent 68%) 0 68%/100% 30% no-repeat;
}
#task-apps { display:flex; align-items:center; gap:4px; min-width:0; flex:1; overflow:auto; scrollbar-width:none; }
.task-app {
  height:40px; min-width:42px; max-width:170px; padding:0 10px; border:0; border-radius:7px;
  background:transparent; display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.task-app:hover, .task-app.active { background:#ffffff19; }
#clock { flex:none; min-width:55px; text-align:center; font-size:12px; line-height:1.25; color:#eee; }
#start-menu {
  position:fixed; z-index:9000; left:8px; bottom:calc(var(--taskbar-h) + 8px);
  width:min(390px, calc(100vw - 16px)); max-height:min(72vh,650px);
  display:none; flex-direction:column; padding:14px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; box-shadow:0 18px 55px #0009;
  backdrop-filter:blur(18px);
}
#start-menu.open { display:flex; }
.start-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:11px; }
.start-head strong { font-size:17px; }
#app-search { width:100%; margin-bottom:10px; padding:9px 11px; border-radius:7px; border:1px solid var(--line); background:#11141a; }
#app-list { overflow:auto; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.start-app {
  min-width:0; display:flex; align-items:center; gap:10px; padding:9px;
  border:1px solid transparent; border-radius:8px; background:transparent; text-align:left;
  touch-action:manipulation;
}
.start-app:hover { background:#ffffff12; border-color:#ffffff19; }
.start-app .app-glyph { width:36px;height:36px;font-size:20px;flex:none; }
.start-app span:last-child { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
#context-menu {
  position:fixed; z-index:9900; display:none; min-width:190px; padding:5px;
  background:#20232b; border:1px solid var(--line); border-radius:9px; box-shadow:0 12px 32px #0009;
}
#context-menu.open { display:block; }
#context-menu button { display:block; width:100%; text-align:left; padding:9px 11px; border:0; border-radius:6px; background:transparent; }
#context-menu button:hover { background:#ffffff18; }
.window {
  position:absolute; z-index:10; min-width:280px; min-height:190px; width:min(720px, calc(100vw - 28px));
  height:min(500px, calc(100vh - 95px)); overflow:hidden; resize:both;
  background:#171a20; border:1px solid #ffffff24; border-radius:11px;
  box-shadow:0 15px 48px #0009; display:flex; flex-direction:column;
}
.window.maximized { inset:8px !important; width:auto !important; height:auto !important; resize:none; }
.window.minimized { display:none; }
.titlebar {
  min-height:42px; display:flex; align-items:center; gap:8px; padding:0 7px 0 13px;
  background:#22262e; border-bottom:1px solid #ffffff12; cursor:grab; touch-action:none; user-select:none;
}
.titlebar:active { cursor:grabbing; }
.window-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.win-controls { display:flex; gap:3px; }
.win-controls button { width:34px;height:32px;border:0;border-radius:6px;background:transparent; }
.win-controls button:hover { background:#ffffff18; }
.win-controls .close:hover { background:#d84646; }
.window-content { flex:1; min-height:0; overflow:auto; padding:14px; background:#171a20; }
.app-toolbar { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.ui-button, .window-content button, .window-content select {
  border:1px solid #ffffff20; border-radius:7px; background:#292e38; padding:7px 10px;
}
.ui-button:hover, .window-content button:hover { background:#353c49; }
input, textarea, select { border:1px solid #ffffff22; background:#101319; border-radius:7px; padding:8px 10px; }
textarea { resize:vertical; }
.list { display:flex; flex-direction:column; gap:4px; }
.file-row, .store-row {
  padding:10px 11px; border-radius:7px; background:#22262e; cursor:pointer;
  user-select:none; touch-action:manipulation;
}
.file-row:hover,.store-row:hover { background:#303641; }
.muted { color:var(--muted); font-size:13px; }
.card { background:#22262e; border:1px solid #ffffff12; border-radius:9px; padding:13px; margin:8px 0; }
#modal-backdrop { position:fixed; inset:0; z-index:9500; display:none; place-items:center; background:#0009; padding:16px; }
#modal-backdrop.open { display:grid; }
.modal { width:min(430px,100%); padding:17px; background:#20242c; border:1px solid var(--line); border-radius:12px; box-shadow:0 15px 45px #000b; }
.modal h3 { margin:0 0 12px; }
.modal input { width:100%; margin:5px 0 12px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; }
.modal-actions .danger { background:#9e3434; }
.calc { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; max-width:350px; margin:auto; }
.calc-display { grid-column:1/-1; width:100%; text-align:right; font-size:26px; padding:12px; }
.calc button { min-height:48px; font-size:18px; }
.paint-wrap { display:flex; flex-direction:column; gap:8px; height:100%; }
.paint-wrap canvas { width:100%; flex:1; min-height:180px; background:white; border-radius:5px; touch-action:none; }
.puzzle { display:grid; grid-template-columns:repeat(5,minmax(38px,60px)); gap:6px; }
.puzzle button { aspect-ratio:1; font-size:22px; }
.terminal-output { white-space:pre-wrap; font:13px/1.5 ui-monospace,monospace; }
.terminal-line { display:flex; gap:7px; }
.terminal-line input { flex:1; min-width:0; font-family:monospace; }
.browser-frame { width:100%; height:100%; min-height:260px; border:0; background:white; border-radius:6px; }
@media(max-width:600px) {
  :root { --taskbar-h:52px; }
  .window { min-width:calc(100vw - 18px); width:calc(100vw - 18px); height:min(72vh,600px); left:9px !important; top:9px !important; resize:none; }
  .window.maximized { inset:4px !important; }
  #app-list { grid-template-columns:1fr; }
  #clock { font-size:11px; }
}
</style>
</head>
<body>
<div id="boot" aria-label="block OS 起動中">
  <img src="block-os-logo.png" alt="block OS ロゴ">
  <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<main id="desktop" aria-label="デスクトップ">
  <div id="desktop-hint">アイコンをドラッグして配置できます。空白をタップすると編集を終了します。</div>
</main>

<div id="taskbar">
  <button id="start-button" aria-label="スタートメニュー"><span class="brick-logo"></span></button>
  <div id="task-apps"></div>
  <div id="clock"></div>
</div>

<section id="start-menu" aria-label="スタートメニュー">
  <div class="start-head"><strong>block OS</strong><span class="muted">1.2.3</span></div>
  <input id="app-search" type="search" placeholder="アプリを検索">
  <div id="app-list"></div>
</section>
<div id="context-menu"></div>
<div id="modal-backdrop"><div class="modal" id="modal"></div></div>

<script>
(() => {
  "use strict";

  const APPS = [
    {id:"store", name:"App Store", icon:"🛍️"},
    {id:"search", name:"b-Search", icon:"🔎"},
    {id:"puzzle", name:"ブロックパズル", icon:"🧩"},
    {id:"paint", name:"Paint", icon:"🎨"},
    {id:"timer", name:"Timer", icon:"⏱️"},
    {id:"files", name:"Files", icon:"📁"},
    {id:"notes", name:"Notes", icon:"📝"},
    {id:"calculator", name:"Calculator", icon:"🧮"},
    {id:"browser", name:"Browser", icon:"🌐"},
    {id:"settings", name:"Settings", icon:"⚙️"},
    {id:"terminal", name:"Terminal", icon:"⌨️"},
    {id:"about", name:"About", icon:"ℹ️"}
  ];
  const APP_BY_ID = Object.fromEntries(APPS.map(a => [a.id, a]));
  const STORAGE_KEY = "blockos-web-1.2.3";
  const defaults = {
    installed: APPS.map(a => a.id),
    home: [],
    positions: {},
    wallpaper: "",
    files: [
      {name:"ようこそ.txt", content:"block OS Web Edition へようこそ！\nFilesで編集・保存できます。"},
      {name:"メモ.txt", content:""}
    ],
    notes: "",
    puzzleScore: 0
  };

  function loadState() {
    let saved = {};
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw) || {};
    } catch (e) { console.warn("保存データを読み込めません。初期設定で起動します。", e); }
    const result = {...defaults, ...saved};
    // 必須アプリは常に登録し、壊れた保存値で一覧が空にならないようにする。
    result.installed = APPS.map(a => a.id);
    result.home = Array.isArray(saved.home) ? saved.home.filter(id => APP_BY_ID[id]) : [];
    result.positions = saved.positions && typeof saved.positions === "object" ? saved.positions : {};
    result.files = Array.isArray(saved.files) ? saved.files.filter(f => f && typeof f.name === "string").map(f => ({name:f.name, content:String(f.content ?? "")})) : defaults.files.map(f=>({...f}));
    result.notes = typeof saved.notes === "string" ? saved.notes : "";
    result.wallpaper = typeof saved.wallpaper === "string" ? saved.wallpaper : "";
    result.puzzleScore = Number(saved.puzzleScore) || 0;
    return result;
  }
  let state = loadState();
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { alert("保存領域が不足しているか、利用できません。画像サイズを小さくして再度お試しください。"); }
  }

  const desktop = document.getElementById("desktop");
  const startMenu = document.getElementById("start-menu");
  const appList = document.getElementById("app-list");
  const contextMenu = document.getElementById("context-menu");
  const taskApps = document.getElementById("task-apps");
  const windows = new Map();
  let zTop = 20, longTimer = null, suppressClickUntil = 0;
  let desktopHold = null;
  let modalCallback = null;

  function appIcon(id) { return APP_BY_ID[id]?.icon || "▣"; }
  function showModal(title, body, actions, callback) {
    const modal = document.getElementById("modal");
    modalCallback = callback || null;
    modal.innerHTML = `<h3>${escapeHtml(title)}</h3>${body}<div class="modal-actions">${actions || '<button data-modal="cancel">閉じる</button>'}</div>`;
    document.getElementById("modal-backdrop").classList.add("open");
    modal.querySelectorAll("[data-modal]").forEach(b => b.addEventListener("click", () => {
      const action = b.dataset.modal;
      document.getElementById("modal-backdrop").classList.remove("open");
      const cb = modalCallback; modalCallback = null;
      if (cb) cb(action);
    }));
    modal.querySelector("input")?.focus();
  }
  function closeModal() { document.getElementById("modal-backdrop").classList.remove("open"); modalCallback=null; }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderStartList(filter="") {
    const q = filter.trim().toLowerCase();
    const items = APPS.filter(a => state.installed.includes(a.id) && (!q || a.name.toLowerCase().includes(q)));
    appList.innerHTML = "";
    items.forEach(app => {
      const b = document.createElement("button");
      b.className = "start-app"; b.innerHTML = `<span class="app-glyph">${app.icon}</span><span>${escapeHtml(app.name)}</span>`;
      b.dataset.app = app.id;
      b.addEventListener("click", () => { closeStart(); openApp(app.id); });
      b.addEventListener("pointerdown", e => {
        if (e.button !== undefined && e.button !== 0) return;
        clearTimeout(longTimer);
        longTimer = setTimeout(() => {
          suppressClickUntil = Date.now() + 500;
          showAppMenu(app.id, e.clientX, e.clientY, "start");
        }, 600);
      });
      ["pointerup","pointercancel","pointerleave"].forEach(type => b.addEventListener(type, () => clearTimeout(longTimer)));
      b.addEventListener("contextmenu", e => { e.preventDefault(); showAppMenu(app.id,e.clientX,e.clientY,"start"); });
      appList.appendChild(b);
    });
  }
  function closeStart() { startMenu.classList.remove("open"); }
  document.getElementById("start-button").addEventListener("click", e => {
    e.stopPropagation(); startMenu.classList.toggle("open"); renderStartList(document.getElementById("app-search").value);
  });
  document.getElementById("app-search").addEventListener("input", e => renderStartList(e.target.value));
  document.addEventListener("pointerdown", e => {
    if (!startMenu.contains(e.target) && e.target.id !== "start-button" && !e.target.closest("#start-button")) closeStart();
    if (!contextMenu.contains(e.target)) contextMenu.classList.remove("open");
  });

  function renderDesktopIcons() {
    desktop.querySelectorAll(".desktop-icon").forEach(n=>n.remove());
    state.home.forEach((id, index) => {
      const app = APP_BY_ID[id]; if (!app) return;
      const icon = document.createElement("button");
      icon.className = "desktop-icon"; icon.dataset.app = id;
      const pos = state.positions[id] || {x:12 + (Math.floor(index/6)*94), y:14 + ((index%6)*98)};
      icon.style.left = `${Math.max(0, Number(pos.x)||0)}px`;
      icon.style.top = `${Math.max(0, Number(pos.y)||0)}px`;
      icon.innerHTML = `<span class="app-glyph">${app.icon}</span><span>${escapeHtml(app.name)}</span>`;
      icon.addEventListener("click", e => {
        if (Date.now() < suppressClickUntil) { e.preventDefault(); return; }
        if (!desktop.classList.contains("editing")) openApp(id);
      });
      icon.addEventListener("contextmenu", e => { e.preventDefault(); showAppMenu(id,e.clientX,e.clientY,"desktop"); });
      setupIconDrag(icon, id);
      desktop.appendChild(icon);
    });
  }
  function setupIconDrag(icon, id) {
    let startX=0,startY=0,origX=0,origY=0,moved=false;
    icon.addEventListener("pointerdown", e => {
      if (e.button !== undefined && e.button !== 0) return;
      startX=e.clientX; startY=e.clientY;
      origX=parseFloat(icon.style.left)||0; origY=parseFloat(icon.style.top)||0; moved=false;
      icon.setPointerCapture?.(e.pointerId);
    });
    icon.addEventListener("pointermove", e => {
      if (!icon.hasPointerCapture?.(e.pointerId)) return;
      if (Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>7) {
        moved=true; desktop.classList.add("editing"); icon.classList.add("selected");
        const rect=desktop.getBoundingClientRect();
        icon.style.left=`${Math.max(0,Math.min(rect.width-82,origX+e.clientX-startX))}px`;
        icon.style.top=`${Math.max(0,Math.min(rect.height-88,origY+e.clientY-startY))}px`;
      }
    });
    icon.addEventListener("pointerup", e => {
      if (moved) {
        const x=Math.round((parseFloat(icon.style.left)||0)/94)*94;
        const y=Math.round((parseFloat(icon.style.top)||0)/98)*98;
        icon.style.left=`${x}px`; icon.style.top=`${y}px`;
        state.positions[id]={x,y}; saveState(); suppressClickUntil=Date.now()+350;
      }
      try { icon.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  }
  function showAppMenu(id, x, y, source) {
    const isHome = state.home.includes(id);
    contextMenu.innerHTML = `
      <button data-action="open">開く</button>
      <button data-action="${isHome ? "remove" : "add"}">${isHome ? "ホーム画面から削除" : "ホーム画面に追加"}</button>`;
    contextMenu.style.left=`${Math.min(x, innerWidth-205)}px`;
    contextMenu.style.top=`${Math.min(y, innerHeight-105)}px`;
    contextMenu.classList.add("open");
    contextMenu.querySelector('[data-action="open"]').onclick=()=>{contextMenu.classList.remove("open");openApp(id);};
    contextMenu.querySelector('[data-action="add"],[data-action="remove"]').onclick=()=>{
      if (isHome) state.home=state.home.filter(item=>item!==id);
      else if (!state.home.includes(id)) state.home.push(id);
      saveState(); renderDesktopIcons(); renderStartList(document.getElementById("app-search").value);
      contextMenu.classList.remove("open");
    };
  }

  let holdStart = null;
  desktop.addEventListener("pointerdown", e => {
    if (e.target !== desktop && e.target.id !== "desktop-hint") return;
    holdStart={x:e.clientX,y:e.clientY};
    clearTimeout(desktopHold);
    desktopHold=setTimeout(()=>{ desktop.classList.add("editing"); },550);
  });
  desktop.addEventListener("pointermove", e => {
    if (holdStart && Math.abs(e.clientX-holdStart.x)+Math.abs(e.clientY-holdStart.y)>12) clearTimeout(desktopHold);
  });
  ["pointerup","pointercancel"].forEach(type=>desktop.addEventListener(type,()=>{
    clearTimeout(desktopHold); holdStart=null;
  }));
  desktop.addEventListener("click", e => {
    if (e.target===desktop || e.target.id==="desktop-hint") {
      desktop.classList.remove("editing");
      desktop.querySelectorAll(".selected").forEach(n=>n.classList.remove("selected"));
    }
  });

  function renderTaskApps() {
    taskApps.innerHTML="";
    for (const [id, w] of windows) {
      const app=APP_BY_ID[id]; if(!app) continue;
      const b=document.createElement("button"); b.className="task-app"+(w.classList.contains("minimized")?"":" active");
      b.innerHTML=`<span>${app.icon}</span><span>${escapeHtml(app.name)}</span>`;
      b.onclick=()=>{ if(w.classList.contains("minimized")) w.classList.remove("minimized"); focusWindow(w); };
      taskApps.appendChild(b);
    }
  }
  function focusWindow(win) { win.style.zIndex=String(++zTop); }
  function openApp(id) {
    if (!APP_BY_ID[id] || !state.installed.includes(id)) return;
    closeStart();
    if (windows.has(id)) {
      const existing=windows.get(id); existing.classList.remove("minimized"); focusWindow(existing); return;
    }
    const app=APP_BY_ID[id], win=document.createElement("section");
    win.className="window"; win.dataset.app=id;
    const offset=(windows.size*24)%100;
    win.style.left=`${Math.max(8,Math.min(innerWidth-310,70+offset))}px`;
    win.style.top=`${Math.max(8,Math.min(innerHeight-250,48+offset))}px`;
    win.innerHTML=`<header class="titlebar"><span>${app.icon}</span><span class="window-title">${escapeHtml(app.name)}</span>
      <div class="win-controls"><button data-win="min" aria-label="最小化">−</button><button data-win="max" aria-label="最大化">□</button><button class="close" data-win="close" aria-label="閉じる">×</button></div></header>
      <div class="window-content"></div>`;
    desktop.appendChild(win); windows.set(id,win);
    win.addEventListener("pointerdown",()=>focusWindow(win));
    win.querySelectorAll("[data-win]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      if(b.dataset.win==="close"){win.remove();windows.delete(id);renderTaskApps();}
      if(b.dataset.win==="min"){win.classList.add("minimized");renderTaskApps();}
      if(b.dataset.win==="max"){win.classList.toggle("maximized");}
    });
    makeWindowDraggable(win);
    renderApp(id,win.querySelector(".window-content"));
    focusWindow(win); renderTaskApps();
  }
  function makeWindowDraggable(win) {
    const bar=win.querySelector(".titlebar");
    let sx=0,sy=0,l=0,t=0,drag=false;
    bar.addEventListener("pointerdown",e=>{
      if(e.target.closest(".win-controls") || win.classList.contains("maximized")) return;
      drag=true;sx=e.clientX;sy=e.clientY;l=win.offsetLeft;t=win.offsetTop;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove",e=>{
      if(!drag)return;
      win.style.left=`${Math.max(0,Math.min(innerWidth-win.offsetWidth,l+e.clientX-sx))}px`;
      win.style.top=`${Math.max(0,Math.min(innerHeight-80,t+e.clientY-sy))}px`;
    });
    bar.addEventListener("pointerup",()=>drag=false);
    bar.addEventListener("pointercancel",()=>drag=false);
    bar.addEventListener("dblclick",e=>{if(!e.target.closest(".win-controls"))win.classList.toggle("maximized");});
  }

  function renderApp(id, root) {
    if (id==="about") {
      root.innerHTML=`<div class="card"><h2>block OS Web Edition</h2><p>バージョン 1.2.3</p><p class="muted">ブラウザー内で動作する、ブロックをモチーフにしたWeb OSです。</p></div><p>設定・アプリデータはこのブラウザーのLocalStorageに保存されます。</p>`;
    } else if (id==="store") {
      root.innerHTML=`<h2>App Store</h2><p class="muted">block OSに搭載されているアプリ</p><div class="list">${APPS.map(a=>`<div class="store-row"><span>${a.icon}　${escapeHtml(a.name)}</span><button data-launch="${a.id}" style="float:right;padding:4px 8px">開く</button></div>`).join("")}</div>`;
      root.querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>openApp(b.dataset.launch));
    } else if (id==="files") renderFiles(root);
    else if (id==="notes") {
      root.innerHTML=`<h2>Notes</h2><textarea id="notes-area" style="width:100%;height:calc(100% - 48px)" placeholder="ここにメモを入力..."></textarea><div class="muted">入力内容は自動保存されます。</div>`;
      const ta=root.querySelector("#notes-area"); ta.value=state.notes; ta.addEventListener("input",()=>{state.notes=ta.value;saveState();});
    } else if (id==="calculator") renderCalculator(root);
    else if (id==="settings") renderSettings(root);
    else if (id==="timer") renderTimer(root);
    else if (id==="paint") renderPaint(root);
    else if (id==="browser") renderBrowser(root,false);
    else if (id==="search") renderBrowser(root,true);
    else if (id==="terminal") renderTerminal(root);
    else if (id==="puzzle") renderPuzzle(root);
  }

  function renderFiles(root) {
    root.innerHTML=`<div class="app-toolbar"><strong>Files</strong><button id="new-file">新しいファイル</button><span class="muted">項目を長押しすると操作メニューを表示</span></div><div class="list" id="file-list"></div>`;
    const list=root.querySelector("#file-list");
    const refresh=()=>{
      list.innerHTML="";
      if(!state.files.length){list.innerHTML='<p class="muted">ファイルはありません。</p>';return;}
      state.files.forEach((file,index)=>{
        const row=document.createElement("div"); row.className="file-row"; row.textContent=file.name; row.dataset.index=index;
        let timer;
        row.addEventListener("click",()=>{if(Date.now()<suppressClickUntil)return; editFile(index);});
        row.addEventListener("pointerdown",e=>{
          timer=setTimeout(()=>{suppressClickUntil=Date.now()+500; fileMenu(index,e.clientX,e.clientY);},600);
        });
        ["pointerup","pointercancel","pointerleave"].forEach(type=>row.addEventListener(type,()=>clearTimeout(timer)));
        row.addEventListener("contextmenu",e=>{e.preventDefault();fileMenu(index,e.clientX,e.clientY);});
        list.appendChild(row);
      });
    };
    function fileMenu(index,x,y){
      contextMenu.innerHTML='<button data-file="rename">名前を変更</button><button data-file="delete">削除</button>';
      contextMenu.style.left=`${Math.min(x,innerWidth-205)}px`;contextMenu.style.top=`${Math.min(y,innerHeight-100)}px`;contextMenu.classList.add("open");
      contextMenu.querySelector('[data-file="rename"]').onclick=()=>{
        contextMenu.classList.remove("open");
        showModal("名前を変更",`<input id="rename-input" value="${escapeHtml(state.files[index].name)}" maxlength="120">`,
          '<button data-modal="cancel">キャンセル</button><button data-modal="ok">保存</button>',action=>{
            if(action==="ok"){const value=document.getElementById("rename-input")?.value?.trim();if(value){state.files[index].name=value;saveState();refresh();}}
          });
      };
      contextMenu.querySelector('[data-file="delete"]').onclick=()=>{
        contextMenu.classList.remove("open");
        showModal("ファイルを削除",`<p>「${escapeHtml(state.files[index].name)}」を削除しますか？</p>`,
          '<button data-modal="cancel">キャンセル</button><button class="danger" data-modal="delete">削除</button>',action=>{
            if(action==="delete"){state.files.splice(index,1);saveState();refresh();}
          });
      };
    }
    function editFile(index) {
      const file=state.files[index];
      root.innerHTML=`<div class="app-toolbar"><button id="back-files">← 一覧</button><strong>${escapeHtml(file.name)}</strong><span class="muted">自動保存</span></div><textarea id="file-editor" style="width:100%;height:calc(100% - 52px)"></textarea>`;
      const editor=root.querySelector("#file-editor");editor.value=file.content;
      editor.addEventListener("input",()=>{file.content=editor.value;saveState();});
      root.querySelector("#back-files").onclick=()=>renderFiles(root);
    }
    root.querySelector("#new-file").onclick=()=>{
      let n=1,name="新しいファイル.txt";
      while(state.files.some(f=>f.name===name)){n++;name=`新しいファイル ${n}.txt`;}
      state.files.push({name,content:""});saveState();refresh();
    };
    refresh();
  }

  function renderCalculator(root) {
    root.innerHTML=`<div class="calc"><input class="calc-display" id="calc-display" value="0" readonly>
      ${["7","8","9","÷","4","5","6","×","1","2","3","−","C","0",".","+","⌫","="].map(x=>`<button data-key="${x}">${x}</button>`).join("")}</div>`;
    let expr="";const display=root.querySelector("#calc-display");
    root.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.key;
      if(k==="C"){expr="";display.value="0";return;}
      if(k==="⌫"){expr=expr.slice(0,-1);display.value=expr||"0";return;}
      if(k==="="){
        try {
          const normalized=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
          if(!/^[0-9+\-*/().\s]+$/.test(normalized))throw new Error();
          const value=Function('"use strict";return ('+normalized+')')();
          if(!Number.isFinite(value))throw new Error();
          expr=String(value);display.value=expr;
        } catch(_){display.value="エラー";expr="";}
        return;
      }
      expr+=k;display.value=expr;
    });
  }

  function renderSettings(root) {
    root.innerHTML=`<h2>Settings</h2><div class="card"><h3>壁紙</h3><p class="muted">画像を選ぶとデスクトップの壁紙に設定します。</p><input type="file" id="wallpaper-file" accept="image/*"><button id="clear-wallpaper">壁紙を解除</button></div>
      <div class="card"><h3>ホーム画面</h3><p>スタートメニューのアプリを長押しして「ホーム画面に追加」を選択できます。</p><button id="edit-desktop">アイコン配置を編集</button></div>
      <div class="card"><h3>保存データ</h3><p class="muted">設定、ファイル、メモ、アイコン位置はこのブラウザーに保存されます。</p></div>`;
    root.querySelector("#wallpaper-file").onchange=e=>{
      const file=e.target.files?.[0];if(!file)return;
      if(!file.type.startsWith("image/")){alert("画像ファイルを選択してください。");return;}
      const reader=new FileReader();
      reader.onload=()=>{state.wallpaper=String(reader.result);saveState();applyWallpaper();};
      reader.readAsDataURL(file);
    };
    root.querySelector("#clear-wallpaper").onclick=()=>{state.wallpaper="";saveState();applyWallpaper();};
    root.querySelector("#edit-desktop").onclick=()=>desktop.classList.add("editing");
  }
  function applyWallpaper() {
    desktop.style.backgroundImage=state.wallpaper
      ? `linear-gradient(135deg,rgba(0,0,0,.12),rgba(0,0,0,.25)),url("${state.wallpaper}")`
      : "linear-gradient(135deg,rgba(0,0,0,.22),rgba(0,0,0,.5))";
  }

  function renderTimer(root) {
    root.innerHTML=`<h2>Timer</h2><div class="card"><div class="app-toolbar"><input id="timer-min" type="number" min="0" max="999" value="1" style="width:90px"><span>分</span><input id="timer-sec" type="number" min="0" max="59" value="0" style="width:90px"><span>秒</span></div><h1 id="timer-display">01:00</h1><button id="timer-start">開始</button> <button id="timer-reset">リセット</button></div>`;
    const disp=root.querySelector("#timer-display"), start=root.querySelector("#timer-start");
    let remaining=60,interval=null;
    const fmt=n=>`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
    const update=()=>disp.textContent=fmt(remaining);
    const setRemaining=()=>remaining=Math.max(0,(Number(root.querySelector("#timer-min").value)||0)*60+(Number(root.querySelector("#timer-sec").value)||0));
    root.querySelectorAll("#timer-min,#timer-sec").forEach(x=>x.oninput=()=>{if(!interval){setRemaining();update();}});
    start.onclick=()=>{
      if(interval){clearInterval(interval);interval=null;start.textContent="再開";return;}
      if(remaining<=0)setRemaining();
      start.textContent="一時停止";
      interval=setInterval(()=>{remaining--;update();if(remaining<=0){clearInterval(interval);interval=null;start.textContent="開始";alert("タイマー終了");}},1000);
    };
    root.querySelector("#timer-reset").onclick=()=>{clearInterval(interval);interval=null;setRemaining();update();start.textContent="開始";};
    update();
  }

  function renderPaint(root) {
    root.innerHTML=`<div class="paint-wrap"><div class="app-toolbar"><label>色 <input type="color" id="paint-color" value="#111111"></label><label>太さ <input type="range" id="paint-size" min="1" max="32" value="5"></label><button id="paint-clear">消去</button></div><canvas id="paint-canvas"></canvas></div>`;
    const canvas=root.querySelector("canvas"),ctx=canvas.getContext("2d");
    let drawing=false;
    const resize=()=>{
      const old=document.createElement("canvas");old.width=canvas.width;old.height=canvas.height;old.getContext("2d").drawImage(canvas,0,0);
      const r=canvas.getBoundingClientRect();const ratio=window.devicePixelRatio||1;
      canvas.width=Math.max(1,Math.round(r.width*ratio));canvas.height=Math.max(1,Math.round(r.height*ratio));
      ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);
      if(old.width>1)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
    };
    requestAnimationFrame(resize);
    const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    canvas.addEventListener("pointerdown",e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
    canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=root.querySelector("#paint-color").value;ctx.lineWidth=Number(root.querySelector("#paint-size").value);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineTo(p.x,p.y);ctx.stroke();});
    ["pointerup","pointercancel"].forEach(t=>canvas.addEventListener(t,()=>drawing=false));
    root.querySelector("#paint-clear").onclick=()=>{const r=canvas.getBoundingClientRect();ctx.fillStyle="#fff";ctx.fillRect(0,0,r.width,r.height);};
  }

  function renderBrowser(root, searchMode) {
    root.innerHTML=`<div class="app-toolbar"><input id="url-input" type="text" placeholder="${searchMode?"検索語を入力":"https://example.com"}" style="flex:1;min-width:130px"><button id="go-button">${searchMode?"検索":"移動"}</button></div><div class="muted" id="browser-note">ページはこのウィンドウ内に表示します。サイト側の制限により表示できない場合があります。</div><iframe class="browser-frame" title="OS内ブラウザー" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>`;
    const input=root.querySelector("#url-input"),frame=root.querySelector("iframe");
    const go=()=>{
      let value=input.value.trim();if(!value)return;
      if(searchMode)value="https://www.google.com/search?q="+encodeURIComponent(value);
      else if(!/^https?:\/\//i.test(value))value="https://"+value;
      try{const u=new URL(value);if(!["http:","https:"].includes(u.protocol))throw new Error();frame.src=u.href;}
      catch(_){alert("URLまたは検索語を確認してください。");}
    };
    root.querySelector("#go-button").onclick=go;
    input.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
    if(searchMode)input.placeholder="検索語を入力";
  }

  function renderTerminal(root) {
    root.innerHTML=`<div class="terminal-output" id="term-out">block OS Terminal 1.2.3\nhelp と入力するとコマンド一覧を表示します。\n</div><div class="terminal-line"><span>&gt;</span><input id="term-input" autocomplete="off" spellcheck="false"></div>`;
    const out=root.querySelector("#term-out"),input=root.querySelector("#term-input");
    input.addEventListener("keydown",e=>{
      if(e.key!=="Enter")return;
      const cmd=input.value.trim();input.value="";
      let result="";
      if(cmd==="help")result="help, date, apps, clear, echo [文字列], open [アプリ名]";
      else if(cmd==="date")result=new Date().toLocaleString();
      else if(cmd==="apps")result=APPS.map(a=>a.name).join(", ");
      else if(cmd==="clear"){out.textContent="";return;}
      else if(cmd.startsWith("echo "))result=cmd.slice(5);
      else if(cmd.startsWith("open ")){
        const q=cmd.slice(5).toLowerCase(),app=APPS.find(a=>a.id===q||a.name.toLowerCase()===q);
        if(app){openApp(app.id);result=`${app.name} を起動しました。`;}else result="アプリが見つかりません。";
      } else if(cmd)result="不明なコマンドです。help を確認してください。";
      out.textContent+=`> ${cmd}\n${result}\n`;out.scrollTop=out.scrollHeight;
    });
  }

  function renderPuzzle(root) {
    let cells=Array.from({length:25},()=>Math.floor(Math.random()*4));
    root.innerHTML=`<h2>ブロックパズル</h2><p>同じ色のブロックをタップして消します。隣接する同色ブロックが2個以上のとき消去できます。</p><p>スコア: <strong id="puzzle-score">${state.puzzleScore}</strong></p><div class="puzzle" id="puzzle-board"></div><button id="puzzle-new" style="margin-top:12px">新しいゲーム</button>`;
    const colors=["#ed5656","#54a7ff","#f1c84b","#66ca78"];
    const board=root.querySelector("#puzzle-board");
    const draw=()=>{
      board.innerHTML="";
      cells.forEach((c,i)=>{
        const b=document.createElement("button");b.style.background=colors[c];b.textContent=cells[i]<0?"":"";
        b.disabled=c<0;b.onclick=()=>select(i);board.appendChild(b);
      });
    };
    const select=i=>{
      const color=cells[i];if(color<0)return;
      const found=new Set([i]),queue=[i];
      while(queue.length){const n=queue.pop(),x=n%5,y=Math.floor(n/5);
        [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([a,b])=>{
          const j=b*5+a;if(a>=0&&a<5&&b>=0&&b<5&&cells[j]===color&&!found.has(j)){found.add(j);queue.push(j);}
        });
      }
      if(found.size<2)return;
      found.forEach(j=>cells[j]=-1);
      state.puzzleScore+=found.size;saveState();root.querySelector("#puzzle-score").textContent=state.puzzleScore;
      draw();
    };
    root.querySelector("#puzzle-new").onclick=()=>{cells=Array.from({length:25},()=>Math.floor(Math.random()*4));draw();};
    draw();
  }

  function updateClock() {
    const now=new Date();
    document.getElementById("clock").innerHTML=`${now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}<br>${now.toLocaleDateString()}`;
  }

  applyWallpaper();
  renderDesktopIcons();
  renderStartList();
  updateClock();setInterval(updateClock,1000);
  // 起動中は操作不可。ロゴは添付画像ファイルをそのまま表示する。
  setTimeout(()=>{
    const boot=document.getElementById("boot");
    boot.style.opacity="0";
    setTimeout(()=>boot.remove(),500);
  },5000);
})();
</script>
